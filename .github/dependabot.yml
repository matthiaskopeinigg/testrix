# Grouped dependency updates to reduce PR noise.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 15
    ignore:
      - dependency-name: electron
        update-types: ['version-update:semver-major']
      - dependency-name: sharp
        update-types: ['version-update:semver-major']
      - dependency-name: ioredis
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: esbuild
        versions: ['>=0.28.0']
      - dependency-name: diff
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: jsdom
        update-types: ['version-update:semver-major']
      - dependency-name: concurrently
        update-types: ['version-update:semver-major']
      - dependency-name: better-sqlite3
        update-types: ['version-update:semver-major']
      - dependency-name: undici
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/bcryptjs'
        update-types: ['version-update:semver-major']
    groups:
      angular:
        patterns:
          - '@angular/*'
        update-types:
          - minor
          - patch
      electron-builder:
        patterns:
          - electron-builder
          - electron-updater
          - app-builder-lib
          - builder-util-runtime
      sigstore:
        patterns:
          - sigstore
          - '@sigstore/*'
      dev-tooling:
        patterns:
          - vitest
          - prettier
          - typescript
          - '@types/*'
          - concurrently
          - cross-env
          - wait-on
          - jsdom
          - esbuild
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /installer-shell
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: electron
        update-types: ['version-update:semver-major']
    groups:
      electron-builder:
        patterns:
          - electron-builder
          - electron-updater
          - app-builder-lib
          - builder-util-runtime
      installer-tooling:
        patterns:
          - undici
          - tar
          - js-yaml
          - tmp

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
