name: Test gate

on:
  workflow_call:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-npm
      - name: Unit tests
        run: npm test

  electron-typecheck:
    name: Electron typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-npm
      - name: Electron typecheck
        run: npm run test:electron
