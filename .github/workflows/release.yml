name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish (for example v2.0.0-beta.2)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  pack:
    name: Pack ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: quality
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Install Linux pack tools
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Pack Windows installer
        if: matrix.name == 'windows'
        run: npm run electron:pack

      - name: Pack desktop installer
        if: matrix.name != 'windows'
        run: npm run build && npm run electron:pack:desktop

      - name: Upload Windows installer
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: testrix-windows
          path: release/setup-shell-build/Testrix.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS installers
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: testrix-macos
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux installers
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: testrix-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish installers
    runs-on: ubuntu-latest
    needs: pack
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: testrix-*
          path: release/publish
          merge-multiple: true

      - name: Resolve version
        id: meta
        run: |
          version="${TAG#v}"
          package="$(node -p "require('./package.json').version")"
          if [ "$package" != "$version" ]; then
            echo "Tag $TAG does not match package.json version $package" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the current beta manifest
        run: |
          mkdir -p release/update-current
          gh release download updates --pattern beta.json --dir release/update-current --clobber || echo "No beta manifest published yet."

      - name: Write update manifests
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: >-
          node tooling/scripts/release-manifest.mjs
          --exe release/publish/Testrix.exe
          --tag ${{ env.TAG }}
          --current-beta release/update-current/beta.json
          --notes-out release/notes.md

      - name: Publish the GitHub release
        run: |
          shopt -s nullglob
          assets=(release/publish/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No installer artifacts to publish." >&2
            exit 1
          fi
          flags=(--title "Testrix ${{ steps.meta.outputs.version }}" --notes-file release/notes.md)
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Deleting and recreating the tag turns the existing release into a draft.
            flags+=(--draft=false)
            if [ "${{ steps.meta.outputs.prerelease }}" != "true" ]; then
              flags+=(--latest)
            fi
            gh release edit "$TAG" "${flags[@]}"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" "${flags[@]}"
          fi

      - name: Publish update manifests
        run: |
          if ! gh release view updates >/dev/null 2>&1; then
            gh release create updates --prerelease --latest=false --title "Update manifests" \
              --notes "Ed25519-signed manifests read by the in-app updater. Do not delete this release."
          fi
          gh release upload updates release/update/* --clobber
