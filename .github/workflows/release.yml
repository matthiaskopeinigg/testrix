name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to pack into a GitHub Release draft (e.g. v1.0.4)'
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test-gate:
    name: Test gate
    uses: ./.github/workflows/test-gate.yml

  pack-windows:
    name: Pack Windows
    needs: test-gate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/setup-node-npm
      - name: Build and sign Windows installer (stable)
        if: ${{ !contains(env.RELEASE_TAG, '-') && secrets.WIN_CSC_LINK != '' }}
        run: npm run electron:pack:release
        env:
          REQUIRE_WIN_CODE_SIGN: '1'
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Build Windows installer (unsigned)
        if: ${{ contains(env.RELEASE_TAG, '-') || secrets.WIN_CSC_LINK == '' }}
        run: npm run electron:build:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: release/Testrix-Setup.exe
          if-no-files-found: error

  pack-linux:
    name: Pack Linux
    needs: test-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/setup-node-npm
      - name: Build Linux installer
        run: npm run electron:build:linux
      - name: Upload Linux installer
        uses: actions/upload-artifact@v7
        with:
          name: linux-installer
          path: release/Testrix-Setup.AppImage
          if-no-files-found: error

  pack-macos:
    name: Pack macOS
    needs: test-gate
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/setup-node-npm
      - name: Build macOS installer
        run: npm run electron:build:mac
      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: mac-installer
          path: release/Testrix-Setup.dmg
          if-no-files-found: error

  publish-release:
    name: Create GitHub Release draft
    needs: [pack-windows, pack-linux, pack-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Extract changelog notes
        run: node scripts/changelog-release-notes.mjs --tag "${{ env.RELEASE_TAG }}" --out release-notes.md
      - name: Create GitHub Release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: node scripts/publish-github-release.mjs
