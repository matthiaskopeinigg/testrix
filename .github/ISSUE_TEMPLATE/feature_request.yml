name: Feature request
description: Propose an improvement or new capability
title: '[feat]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: Describe the problem and your proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should Testrix behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional
