name: Bug report
description: Report something that does not work as expected
title: '[bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Testrix. Please fill in as much as you can.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, sample collection/URL if relevant
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Testrix version
      placeholder: e.g. 1.0.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
        - Multiple / unknown
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Optional paste from main-process logs or UI screenshots
