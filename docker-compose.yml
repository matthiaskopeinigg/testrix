# Local databases for the Data workspace.
# Redis: type Redis, host localhost, port 6379, DB index 0.
# Redis Commander UI: http://localhost:8081
# PostgreSQL: type PostgreSQL, host localhost, port 5432,
#   user testrix, password testrix, database testrix.
# Usage: docker compose up -d
# Stop:   docker compose down

services:
  redis:
    image: redis:7-alpine
    container_name: api-workbench-redis
    hostname: redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: api-workbench-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: testrix-postgres
    hostname: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: testrix
      POSTGRES_PASSWORD: testrix
      POSTGRES_DB: testrix
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U testrix -d testrix']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  postgres-data:
