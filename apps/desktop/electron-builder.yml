appId: dev.testrix.app
productName: Testrix
executableName: Testrix
copyright: Copyright © 2026 Matthias Kopeinigg
artifactName: Testrix.${ext}

electronVersion: 44.3.0

directories:
  output: ../../release
  buildResources: ../../build

extraMetadata:
  name: Testrix
  author:
    name: Matthias Kopeinigg
  description: Testrix — local-first desktop API workbench

files:
  - dist/**/*
  - package.json

asar: true

extraResources:
  - from: src/splash
    to: splash
  - from: src/error
    to: error
  - from: src/assets
    to: assets
  - from: ../renderer/dist/renderer/browser
    to: browser

win:
  icon: icon.ico
  target:
    - dir
  # No paid Authenticode certificate. Pack must stay unsigned.
  forceCodeSigning: false
  # rcedit writes icon, CompanyName, FileDescription, and copyright. Authenticode stays off.
  signAndEditExecutable: true

mac:
  icon: icon.png
  category: public.app-category.developer-tools
  target:
    - target: dir
      arch:
        - x64
        - arm64
  identity: null

linux:
  icon: icon.png
  target:
    - dir
  category: Development
