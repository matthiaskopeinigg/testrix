appId: dev.testrix.app
productName: Testrix
executableName: Testrix
copyright: Copyright © 2026 Matthias Kopeinigg
artifactName: Testrix.${ext}

electronVersion: 44.3.0

directories:
  output: ../../release
  buildResources: ../../build

extraMetadata:
  name: Testrix
  homepage: https://github.com/matthiaskopeinigg/testrix
  author:
    name: Matthias Kopeinigg
    email: matthiaskopeinigg@gmail.com
  description: Testrix — local-first desktop API workbench

files:
  - dist/**/*
  - package.json

asar: true

extraResources:
  - from: src/splash
    to: splash
  - from: src/error
    to: error
  - from: src/assets
    to: assets
  - from: ../renderer/dist/renderer/browser
    to: browser

win:
  icon: icon.ico
  target:
    - dir
  # No paid Authenticode certificate. Pack must stay unsigned.
  forceCodeSigning: false
  # rcedit writes icon, CompanyName, FileDescription, and copyright. Authenticode stays off.
  signAndEditExecutable: true

mac:
  icon: icon.png
  category: public.app-category.developer-tools
  # No paid Apple Developer certificate. The dmg stays unsigned.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: Testrix-mac-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64

linux:
  icon: icon.png
  category: Development
  artifactName: Testrix-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
