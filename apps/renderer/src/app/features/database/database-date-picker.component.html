<div class="tx-db-datepicker tx-menu" role="dialog" aria-label="Choose date">
  @if (showCalendar()) {
    <div class="tx-db-datepicker__nav">
      <button type="button" class="tx-db-datepicker__shift" (click)="handlePrev()" aria-label="Previous month">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M7.5 2.5 4 6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <p>{{ monthLabel() }}</p>
      <button type="button" class="tx-db-datepicker__shift" (click)="handleNext()" aria-label="Next month">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M4.5 2.5 8 6 4.5 9.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
    <div class="tx-db-datepicker__week">
      @for (label of weekdays; track label) {
        <span>{{ label }}</span>
      }
    </div>
    <div class="tx-db-datepicker__grid">
      @for (cell of days(); track $index) {
        <button
          type="button"
          class="tx-db-datepicker__day"
          [class.is-muted]="!cell.inMonth"
          [class.is-today]="cell.isToday"
          [class.is-selected]="cell.isSelected"
          (click)="handleDay(cell)"
        >
          {{ cell.day }}
        </button>
      }
    </div>
  }

  @if (showTime()) {
    <div class="tx-db-datepicker__time">
      <span>Time</span>
      <input
        type="text"
        inputmode="numeric"
        maxlength="2"
        [value]="hours()"
        (change)="handleTime('hours', $event)"
        aria-label="Hours"
      />
      <span>:</span>
      <input
        type="text"
        inputmode="numeric"
        maxlength="2"
        [value]="minutes()"
        (change)="handleTime('minutes', $event)"
        aria-label="Minutes"
      />
      <span>:</span>
      <input
        type="text"
        inputmode="numeric"
        maxlength="2"
        [value]="seconds()"
        (change)="handleTime('seconds', $event)"
        aria-label="Seconds"
      />
    </div>
  }

  <div class="tx-db-datepicker__actions">
    <button type="button" class="tx-db-datepicker__ghost" (click)="handleNow()">Now</button>
    @if (kind() !== 'date') {
      <button type="button" class="tx-db-datepicker__apply" (click)="handleApply()">Apply</button>
    }
  </div>
</div>
