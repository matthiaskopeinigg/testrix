<div class="tx-plantuml-toolbar">
  <div class="tx-plantuml-toolbar__search">
    <tx-input
      id="plantuml-search"
      placeholder="Search diagrams"
      [value]="store.search()"
      (valueChange)="handleSearch($event)"
    />
  </div>
  <div class="tx-plantuml-toolbar__actions" role="toolbar" aria-label="Diagram tools">
    <tx-hint [label]="expandToggleLabel()" placement="bottom">
      <button
        type="button"
        class="tx-plantuml-toolbar__btn"
        [class.is-active]="store.allFoldersExpanded()"
        [attr.aria-label]="expandToggleLabel()"
        [attr.aria-pressed]="store.allFoldersExpanded()"
        (click)="handleToggleExpandAll()"
      >
        @if (store.allFoldersExpanded()) {
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 10.5 8 6l5 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M3 13.5 8 9l5 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />
          </svg>
        } @else {
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 5.5 8 10l5-4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M3 2.5 8 7l5-4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />
          </svg>
        }
      </button>
    </tx-hint>
    <div class="tx-plantuml-toolbar__menu-wrap">
      <tx-hint
        label="Filter"
        [detail]="store.isFilterActive() ? 'Filters active' : null"
        placement="bottom"
        [suppressed]="openMenu() === 'filter'"
      >
        <button
          type="button"
          class="tx-plantuml-toolbar__btn"
          [class.is-active]="store.isFilterActive() || openMenu() === 'filter'"
          aria-label="Filter diagrams"
          [attr.aria-expanded]="openMenu() === 'filter'"
          (click)="handleToggleMenu('filter', $event)"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.5 3.5h11l-4 4.8V13l-3-1.5V8.3L2.5 3.5z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" />
          </svg>
        </button>
      </tx-hint>
    </div>
    <div class="tx-plantuml-toolbar__menu-wrap">
      <tx-hint [label]="'Sort: ' + sortLabel()" placement="bottom" [suppressed]="openMenu() === 'sort'">
        <button
          type="button"
          class="tx-plantuml-toolbar__btn"
          [class.is-active]="openMenu() === 'sort'"
          aria-label="Sort diagrams"
          [attr.aria-expanded]="openMenu() === 'sort'"
          (click)="handleToggleMenu('sort', $event)"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 4h8M4 8h5.5M4 12h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </button>
      </tx-hint>
    </div>
  </div>

  @if (openMenu(); as menu) {
    <div
      class="tx-plantuml-toolbar__menu tx-menu"
      role="menu"
      animate.leave="tx-popover-leave"
      [style.top.px]="menuPosition()?.top"
      [style.left.px]="menuPosition()?.left"
      [style.width.px]="menuPosition()?.width"
      [style.max-height.px]="menuPosition()?.maxHeight"
      (pointerdown)="$event.stopPropagation()"
    >
      @if (menu === 'filter') {
        <p class="tx-plantuml-toolbar__menu-title">Type</p>
        @for (kind of filterKinds; track kind) {
          <button
            type="button"
            class="tx-plantuml-toolbar__option"
            role="menuitemcheckbox"
            [attr.aria-checked]="store.filters().includes(kind)"
            (click)="handleToggleKind(kind)"
          >
            <span>{{ filterLabel(kind) }}</span>
            @if (store.filters().includes(kind)) {
              <span class="tx-plantuml-toolbar__check" aria-hidden="true">✓</span>
            }
          </button>
        }
        @if (store.isFilterActive()) {
          <button type="button" class="tx-plantuml-toolbar__clear" (click)="handleClearFilters()">Clear filters</button>
        }
      } @else {
        <p class="tx-plantuml-toolbar__menu-title">Sort by</p>
        @for (option of sortOptions; track option.id) {
          <button
            type="button"
            class="tx-plantuml-toolbar__option"
            role="menuitemradio"
            [attr.aria-checked]="store.sortMode() === option.id"
            (click)="handleSort(option.id)"
          >
            <span>{{ option.label }}</span>
            @if (store.sortMode() === option.id) {
              <span class="tx-plantuml-toolbar__check" aria-hidden="true">✓</span>
            }
          </button>
        }
      }
    </div>
  }
</div>
