@let item = node();
<div class="tx-pack-tree__node" [style.--tx-tree-depth]="depth()">
  <div
    class="tx-pack-tree__row"
    [class.is-folder]="item.kind === 'folder'"
    [class.is-expanded]="isExpanded()"
    role="treeitem"
    [attr.aria-expanded]="item.kind === 'folder' ? isExpanded() : null"
    [attr.aria-level]="depth() + 1"
    tabindex="0"
    (click)="handleRowClick()"
    (keydown)="handleRowKeydown($event)"
  >
    @if (item.kind === 'folder') {
      <button
        type="button"
        class="tx-pack-tree__chevron"
        [class.is-expanded]="isExpanded()"
        [attr.aria-label]="isExpanded() ? 'Collapse ' + item.name : 'Expand ' + item.name"
        (click)="toggleExpand($event)"
      >
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <path d="M3.2 1.8 7.4 5 3.2 8.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        </svg>
      </button>
    } @else {
      <span class="tx-pack-tree__chevron-spacer" aria-hidden="true"></span>
    }

    <label class="tx-pack-tree__check" (click)="$event.stopPropagation()">
      <input
        #checkbox
        type="checkbox"
        [attr.aria-label]="'Include ' + item.name"
        (change)="toggleSelection($event)"
      />
    </label>

    @if (item.detail) {
      <span class="tx-pack-tree__detail">{{ item.detail }}</span>
    }
    <span class="tx-pack-tree__name">{{ item.name }}</span>
  </div>

  @if (item.kind === 'folder' && item.children?.length && isExpanded()) {
    <div class="tx-pack-tree__children" role="group">
      @for (child of item.children; track child.id) {
        <tx-pack-selection-tree-node
          [node]="child"
          [depth]="depth() + 1"
          [nodes]="nodes()"
          [selectedIds]="selectedIds()"
          [expandedIds]="expandedIds()"
          (selectedIdsChange)="selectedIdsChange.emit($event)"
          (expandedIdsChange)="expandedIdsChange.emit($event)"
        />
      }
    </div>
  }
</div>
