<div
  class="tx-workbench-group"
  [class.is-focused]="focused()"
  (pointerdown)="focusGroup.emit()"
>
  <tx-workbench-tablist
    [groupId]="group().id"
    [listId]="listId()"
    [connectedTo]="connectedTo()"
    [tabs]="group().tabs"
    [activeTabId]="group().activeTabId"
    [justOpenedId]="justOpenedId()"
    [focused]="focused()"
    (select)="select.emit($event)"
    (close)="close.emit($event)"
    (reorder)="reorder.emit($event)"
    (transfer)="transfer.emit($event)"
    (focusGroup)="focusGroup.emit()"
    (dragStart)="dragStart.emit()"
    (dragEnd)="dragEnd.emit()"
  />
  <div class="tx-workbench-group__stage" [attr.data-slide]="slideDir()">
    @if (activeTab(); as tab) {
      @for (id of [tab.id]; track id) {
        <div
          class="tx-workbench-group__panel"
          [attr.data-swap]="swapNonce() % 2"
          [animate.enter]="panelEnter()"
          animate.leave="tx-workbench-panel-out"
          (animationstart)="handlePanelAnimationStart($event)"
          (animationend)="handlePanelAnimationEnd($event)"
          (animationcancel)="handlePanelAnimationEnd($event)"
        >
          <tx-workbench-panel [tab]="tab" />
        </div>
      }
    }
  </div>
</div>
