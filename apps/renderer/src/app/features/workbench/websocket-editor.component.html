<div class="tx-ws-editor">
  <header class="tx-ws-editor__urlbar" aria-label="WebSocket URL">
    <span class="tx-ws-editor__badge">WS</span>

    <input
      class="tx-ws-editor__url"
      type="text"
      [value]="url()"
      (input)="handleUrlInput($event)"
      aria-label="WebSocket URL"
      spellcheck="false"
      autocomplete="off"
    />

    <span
      class="tx-ws-editor__status"
      [class.is-connected]="connected()"
      aria-live="polite"
    >
      {{ connected() ? 'Connected' : 'Disconnected' }}
    </span>

    <tx-hint
      [label]="connected() ? 'Disconnect' : 'Connect'"
      detail="Mock socket only"
      placement="bottom"
    >
      <button
        type="button"
        class="tx-ws-editor__connect"
        [class.is-connected]="connected()"
        (click)="handleConnectToggle()"
        [attr.aria-label]="connected() ? 'Disconnect' : 'Connect'"
      >
        {{ connected() ? 'Disconnect' : 'Connect' }}
      </button>
    </tx-hint>
  </header>

  <div class="tx-ws-editor__stream" aria-label="Message stream">
    <ul class="tx-ws-editor__messages">
      @for (message of messages(); track trackMessage($index, message)) {
        <li class="tx-ws-editor__message" [attr.data-direction]="message.direction">
          <span class="tx-ws-editor__direction" aria-hidden="true">
            {{ message.direction === 'out' ? '↑' : '↓' }}
          </span>
          <span class="tx-ws-editor__time">{{ message.at }}</span>
          <code class="tx-ws-editor__body">{{ message.body }}</code>
        </li>
      }
    </ul>
  </div>

  <footer class="tx-ws-editor__composer">
    <label class="tx-visually-hidden" for="tx-ws-composer">Message</label>
    <textarea
      id="tx-ws-composer"
      class="tx-ws-editor__textarea"
      rows="3"
      [value]="composer()"
      (input)="handleComposerInput($event)"
      spellcheck="false"
      [attr.aria-disabled]="!connected()"
    ></textarea>
    <tx-hint label="Send message" detail="Appends a mock echo" placement="top">
      <button
        type="button"
        class="tx-ws-editor__send"
        (click)="handleSend()"
        [disabled]="!connected()"
        aria-label="Send message"
      >
        Send
      </button>
    </tx-hint>
  </footer>
</div>
