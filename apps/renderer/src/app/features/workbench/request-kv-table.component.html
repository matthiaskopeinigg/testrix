<table class="tx-kv" [attr.aria-label]="label()">
  <thead>
    <tr>
      <th scope="col" class="tx-kv__check"></th>
      <th scope="col">Key</th>
      <th scope="col">Value</th>
    </tr>
  </thead>
  <tbody>
    @for (row of rows(); track trackRow($index, row)) {
      <tr [class.is-disabled]="!row.enabled">
        <td class="tx-kv__check">
          <tx-hint [label]="enableLabel(row)" placement="right">
            <tx-check
              variant="compact"
              [checked]="row.enabled"
              [label]="'Enable ' + (row.key || 'row')"
              (checkedChange)="handleEnabled($index, $event)"
            />
          </tx-hint>
        </td>
        <td>
          <input
            class="tx-kv__cell"
            type="text"
            [value]="row.key"
            placeholder="Key"
            spellcheck="false"
            autocomplete="off"
            (input)="handleKey($index, $event)"
          />
        </td>
        <td>
          <input
            class="tx-kv__cell"
            type="text"
            [value]="row.value"
            placeholder="Value"
            spellcheck="false"
            autocomplete="off"
            (input)="handleValue($index, $event)"
          />
        </td>
      </tr>
    }
  </tbody>
</table>
