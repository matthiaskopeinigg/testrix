@switch (kind()) {
  @case ('folder') {
    <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true">
      <path d="M2 3.5h3.2l1 1.2H12v6.3H2V3.5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" />
    </svg>
  }
  @case ('environment') {
    <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M8 4H7a2 2 0 0 0-2 2v3a2 2 0 0 1-2 2 2 2 0 0 1 2 2v3a2 2 0 0 0 2 2h1M16 4h1a2 2 0 0 1 2 2v3a2 2 0 0 0 2 2 2 2 0 0 0-2 2v3a2 2 0 0 1-2 2h-1"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>
  }
  @case ('database') {
    <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true">
      <ellipse cx="7" cy="4.2" rx="4.4" ry="1.6" fill="none" stroke="currentColor" stroke-width="1.2" />
      <path d="M2.6 4.2v5.6c0 .9 2 1.6 4.4 1.6s4.4-.7 4.4-1.6V4.2" fill="none" stroke="currentColor" stroke-width="1.2" />
    </svg>
  }
  @case ('query') {
    <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true">
      <path d="M2.5 3.5h9M2.5 7h6M2.5 10.5h4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
    </svg>
  }
  @case ('flow') {
    <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true">
      <circle cx="3.4" cy="3.6" r="1.7" fill="none" stroke="currentColor" stroke-width="1.2" />
      <circle cx="10.6" cy="10.4" r="1.7" fill="none" stroke="currentColor" stroke-width="1.2" />
      <path d="M4.8 4.9c2 0 3.4 1.2 3.4 3.1" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
    </svg>
  }
  @case ('template') {
    <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true">
      <rect x="2.2" y="2.6" width="9.6" height="8.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.2" />
      <path d="M2.2 5.6h9.6" fill="none" stroke="currentColor" stroke-width="1.2" />
    </svg>
  }
  @case ('regression') {
    <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true">
      <path d="M3 8.6 5.6 11l5.4-7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  }
  @case ('diagram') {
    <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true">
      <rect x="2" y="2.4" width="4.4" height="3.4" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.15" />
      <rect x="7.6" y="8.2" width="4.4" height="3.4" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.15" />
      <path d="M4.2 5.8v2.6h5.6" fill="none" stroke="currentColor" stroke-width="1.15" />
    </svg>
  }
  @case ('websocket') {
    <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true">
      <path d="M2 9.2c1.6-4.8 3.2-4.8 5 0s3.4 4.8 5 0" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
    </svg>
  }
  @case ('request') {
    <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true">
      <path d="M2.8 7h8.4M8.2 4 11.2 7l-3 3" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  }
  @default {
    <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true">
      <rect x="2.4" y="2.4" width="9.2" height="9.2" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.2" />
    </svg>
  }
}
