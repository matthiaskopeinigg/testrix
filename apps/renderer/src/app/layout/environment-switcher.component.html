<tx-hint label="Environment used in requests" placement="bottom" [suppressed]="envSelect.open()">
  <tx-select
    #envSelect
    variant="chrome"
    [value]="activeId()"
    [options]="options()"
    ariaLabel="Environment used in requests"
    (valueChange)="handleSelect($event)"
  >
    <span class="tx-env-switch__mark" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24">
        <path
          d="M8 4H7a2 2 0 0 0-2 2v3a2 2 0 0 1-2 2 2 2 0 0 1 2 2v3a2 2 0 0 0 2 2h1M16 4h1a2 2 0 0 1 2 2v3a2 2 0 0 0 2 2 2 2 0 0 0-2 2v3a2 2 0 0 1-2 2h-1"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>
  </tx-select>
</tx-hint>
