<div class="tx-ws-switch">
  <tx-hint
    label="Workspace"
    [detail]="hintDetail()"
    placement="bottom"
    [suppressed]="open() || managerOpen()"
  >
    <button
      type="button"
      class="tx-ws-switch__trigger"
      cdkOverlayOrigin
      #origin="cdkOverlayOrigin"
      aria-label="Workspace"
      [attr.aria-expanded]="open()"
      [attr.aria-controls]="listId"
      aria-haspopup="listbox"
      (click)="handleToggle(origin)"
      (keydown)="handleKeydown($event, origin)"
    >
      <span class="tx-ws-switch__mark" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 14 14">
          <rect x="1.8" y="3.8" width="8" height="8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.25" />
          <path
            d="M5 3.8V3.4A1.6 1.6 0 0 1 6.6 1.8h4A1.6 1.6 0 0 1 12.2 3.4v4A1.6 1.6 0 0 1 10.6 9H10.2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.25"
          />
        </svg>
      </span>
      <span class="tx-ws-switch__name">{{ activeName() }}</span>
      @if (shared()) {
        <span class="tx-ws-switch__shared">Shared</span>
        <span class="tx-ws-switch__glyph" [attr.data-state]="collab.status().state" aria-hidden="true">
          @if (collab.status().state === 'syncing') {
            <tx-spinner label="Syncing" />
          } @else if (collab.status().state === 'offline') {
            <svg width="14" height="14" viewBox="0 0 14 14">
              <path d="M2.2 11.8 11.8 2.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
              <circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.25" />
            </svg>
          } @else if (collab.status().state === 'attention') {
            <span class="tx-ws-switch__attention"></span>
          } @else if (collab.status().state === 'paused') {
            <svg width="14" height="14" viewBox="0 0 14 14">
              <path d="M5 3.5v7M9 3.5v7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          } @else {
            <svg width="14" height="14" viewBox="0 0 14 14">
              <path d="M3.2 7.2 5.8 9.8 10.8 4.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
        </span>
      }
      <svg class="tx-ws-switch__chevron" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
        <path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
      </svg>
    </button>
  </tx-hint>
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayWidth]="triggerWidth()"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayFlexibleDimensions]="false"
  [cdkConnectedOverlayViewportMargin]="8"
  (overlayOutsideClick)="handleOutside()"
>
  <div class="tx-ws-switch__menu" [id]="listId">
    <button type="button" class="tx-ws-switch__manage" (click)="handleCollab()">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <rect x="1.8" y="3.4" width="6.4" height="6.4" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.2" />
        <rect x="5.8" y="4.6" width="6.4" height="6.4" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.2" />
      </svg>
      {{ shared() ? 'Open Collab' : 'Connect a repository' }}
    </button>
    <button type="button" class="tx-ws-switch__manage" (click)="handleManage()">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <circle cx="7" cy="7" r="2.1" fill="none" stroke="currentColor" stroke-width="1.2" />
        <path
          d="M7 1.6v1.2M7 11.2v1.2M1.6 7h1.2M11.2 7h1.2M3.1 3.1l.85.85M10.05 10.05l.85.85M10.9 3.1l-.85.85M3.95 10.05l-.85.85"
          stroke="currentColor"
          stroke-width="1.2"
          stroke-linecap="round"
        />
      </svg>
      Manage workspaces
    </button>
    <span class="tx-ws-switch__rule" aria-hidden="true"></span>
    <div class="tx-ws-switch__list" role="listbox" aria-label="Workspaces">
      @for (group of groups(); track group.id) {
        <div class="tx-ws-switch__group" role="group" [attr.aria-label]="group.label">
          @if (showGroupHeads()) {
            <div class="tx-ws-switch__group-head" aria-hidden="true">
              @if (group.state) {
                <span class="tx-ws-switch__dot" [attr.data-state]="group.state"></span>
              }
              <span class="tx-ws-switch__group-name">{{ group.label }}</span>
            </div>
          }
          @for (item of group.items; track item.id) {
            <button
              type="button"
              class="tx-ws-switch__option"
              role="option"
              [attr.aria-selected]="activeId() === item.id"
              (click)="handleSelect(item.id)"
            >
              <span class="tx-ws-switch__option-label">
                <span>{{ workspaceLabel(item) }}</span>
              </span>
              @if (activeId() === item.id) {
                <span class="tx-ws-switch__check" aria-hidden="true">✓</span>
              }
            </button>
          }
          @if (group.addRepoId) {
            <button type="button" class="tx-ws-switch__add" (click)="handleAddFrom(group.addRepoId)">
              Add workspaces from {{ group.label }}
            </button>
          }
        </div>
      }
    </div>
  </div>
</ng-template>
