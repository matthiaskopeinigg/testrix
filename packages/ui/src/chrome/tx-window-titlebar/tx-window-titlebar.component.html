<header
  class="tx-titlebar"
  [class.tx-titlebar--mac]="platform() === 'darwin'"
>
  <div class="tx-titlebar__brand">
    <img class="tx-titlebar__logo" [src]="logoSrc()" width="18" height="18" alt="" />
    <span class="tx-titlebar__name">{{ productName() }}</span>
    <div class="tx-titlebar__leading">
      <ng-content select="[txTitlebarStart]" />
    </div>
  </div>
  <div class="tx-titlebar__drag" aria-hidden="true"></div>
  <div class="tx-titlebar__actions">
    <div class="tx-titlebar__slot">
      <ng-content />
    </div>
    <tx-hint label="Collab" [detail]="collabDetail()" placement="bottom">
      <button
        type="button"
        class="tx-titlebar__icon tx-titlebar__collab"
        [class.is-active]="collabOpen()"
        aria-label="Collab"
        [attr.aria-pressed]="collabOpen()"
        (pointerdown)="onChromePointer($event, toggleCollab)"
      >
        <svg width="14" height="14" viewBox="0 0 18 18" aria-hidden="true">
          <rect x="2.2" y="4.2" width="8.2" height="8.2" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.35" />
          <rect x="7.4" y="5.6" width="8.2" height="8.2" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.35" />
        </svg>
        @if (collabState()) {
          <span class="tx-titlebar__dot" [attr.data-state]="collabState()" aria-hidden="true"></span>
        }
      </button>
    </tx-hint>
    <tx-hint label="Settings" [detail]="settingsNotice()" [keys]="['Ctrl', ',']" placement="bottom">
      <button
        type="button"
        class="tx-titlebar__icon"
        [attr.aria-label]="settingsNotice() ? 'Open settings, ' + settingsNotice() : 'Open settings'"
        (pointerdown)="onChromePointer($event, openSettings)"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
          />
          <circle
            cx="12"
            cy="12"
            r="3"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
          />
        </svg>
        @if (settingsNotice()) {
          <span class="tx-titlebar__dot" data-state="notice" aria-hidden="true"></span>
        }
      </button>
    </tx-hint>
    @if (platform() !== 'darwin') {
      <span class="tx-titlebar__split" aria-hidden="true"></span>
      <button
        type="button"
        class="tx-titlebar__caption"
        aria-label="Minimize"
        (pointerdown)="onCaptionPointerDown($event)"
        (pointerup)="onCaptionPointerUp($event, minimize)"
      >
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <path d="M1.5 5h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
        </svg>
      </button>
      <button
        type="button"
        class="tx-titlebar__caption"
        [attr.aria-label]="isMaximized() ? 'Restore' : 'Maximize'"
        (pointerdown)="onCaptionPointerDown($event)"
        (pointerup)="onCaptionPointerUp($event, maximize)"
      >
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          @if (isMaximized()) {
            <path
              d="M3.2 3.8h4.6v4.6H3.2zM5.2 2.2h4.6v4.6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linejoin="round"
            />
          } @else {
            <rect
              x="1.7"
              y="1.7"
              width="6.6"
              height="6.6"
              rx="1"
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
            />
          }
        </svg>
      </button>
      <button
        type="button"
        class="tx-titlebar__caption tx-titlebar__caption--close"
        aria-label="Close"
        (pointerdown)="onCaptionPointerDown($event)"
        (pointerup)="onCaptionPointerUp($event, close)"
      >
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
        </svg>
      </button>
    }
  </div>
</header>
