<app-workspace-sidebar-panel-shell
  class="database-sidebar-panel"
  [searchPlaceholder]="searchPlaceholder()"
  [searchAriaLabel]="searchAriaLabel()"
  [showFolderToggle]="hasFolders()"
  [allFoldersExpanded]="allExpanded()"
  [useDefaultToolbarActions]="false"
  (searchChange)="handleSearch($event)"
  (allFoldersExpandedChange)="handleExpandAll($event)"
>
  <div workspacePanelToolbarActions class="database-sidebar-panel__toolbar-actions">
    <button
      type="button"
      class="workspace-panel-shell__icon-btn"
      [class.is-pressed]="filterToolbarActive()"
      aria-label="Filter queries"
      txTooltip="Filter queries"
      txTooltipPosition="bottom"
      [attr.aria-expanded]="filterMenuOpen()"
      (click)="handleFilterToolbarClick($event)"
    >
      <tx-icon name="filter" [size]="16" aria-hidden="true" />
    </button>
    <button
      type="button"
      class="workspace-panel-shell__icon-btn"
      [class.is-pressed]="sortToolbarActive()"
      aria-label="Sort queries"
      txTooltip="Sort queries"
      txTooltipPosition="bottom"
      [attr.aria-expanded]="sortMenuOpen()"
      (click)="handleSortToolbarClick($event)"
    >
      <tx-icon name="list" [size]="16" aria-hidden="true" />
    </button>
  </div>

  <section
    class="database-sidebar-panel__section database-sidebar-panel__section--connections"
    [class.is-collapsed]="!showConnectionList()"
    aria-label="Database connections"
  >
    <header class="database-sidebar-panel__section-head">
      <button
        type="button"
        class="database-sidebar-panel__section-toggle"
        [attr.aria-expanded]="showConnectionList()"
        aria-controls="database-sidebar-connections"
        (click)="handleToggleConnections()"
      >
        <tx-icon
          name="chevronDown"
          [size]="14"
          class="database-sidebar-panel__section-chevron"
          [class.is-collapsed]="!showConnectionList()"
          aria-hidden="true"
        />
        <span class="database-sidebar-panel__section-title">Connections</span>
        <span class="database-sidebar-panel__section-count">{{ connectionCount() }}</span>
      </button>
    </header>
    @if (showConnectionList()) {
      <div
        id="database-sidebar-connections"
        class="database-sidebar-panel__connection-tree"
        (contextmenu)="handleConnectionTreeAreaContextMenu($event)"
      >
        <tx-tree
          #connectionTree
          [entranceStagger]="true"
          [emptyMessage]="connectionTreeEmptyMessage()"
          [nodes]="filteredConnectionNodes()"
          [config]="connectionTreeConfig()"
          [expandedIds]="connectionExpandedIds()"
          [selectionIds]="connectionSelectionIds()"
          [renamingNodeId]="renamingNodeId()"
          (nodesChange)="handleConnectionNodesChange($event)"
          (expandedChange)="handleConnectionExpandedChange($event)"
          (nodeClick)="handleConnectionNodeClick($event)"
          (nodeDblClick)="handleConnectionNodeDblClick($event)"
          (renameCommit)="handleRenameCommit($event)"
          (renameCancel)="handleRenameCancel()"
          (rowContextMenu)="handleConnectionRowContextMenu($event)"
        />
      </div>
    }
  </section>

  <section
    class="database-sidebar-panel__section database-sidebar-panel__section--queries"
    [class.is-collapsed]="!showQueryList()"
    aria-label="Saved queries"
  >
    <header class="database-sidebar-panel__section-head">
      <button
        type="button"
        class="database-sidebar-panel__section-toggle"
        [attr.aria-expanded]="showQueryList()"
        aria-controls="database-sidebar-queries"
        (click)="handleToggleQueries()"
      >
        <tx-icon
          name="chevronDown"
          [size]="14"
          class="database-sidebar-panel__section-chevron"
          [class.is-collapsed]="!showQueryList()"
          aria-hidden="true"
        />
        <span class="database-sidebar-panel__section-title">Queries</span>
        <span class="database-sidebar-panel__section-count">{{ queryCount() }}</span>
      </button>
    </header>
    @if (showQueryList()) {
      <div
        id="database-sidebar-queries"
        class="database-sidebar-panel__query-tree"
        (contextmenu)="handleQueryTreeAreaContextMenu($event)"
      >
        <tx-tree
          #queryTree
          class="database-sidebar-panel__tree"
          [entranceStagger]="true"
          [emptyMessage]="treeEmptyMessage()"
          [nodes]="filteredNodes()"
          [config]="treeConfig()"
          [expandedIds]="queryExpandedIds()"
          [selectionIds]="treeSelectionIds()"
          [renamingNodeId]="renamingNodeId()"
          (nodesChange)="handleNodesChange($event)"
          (expandedChange)="handleQueryExpandedChange($event)"
          (nodeClick)="handleQueryNodeClick($event)"
          (nodeDblClick)="handleQueryNodeDblClick($event)"
          (renameCommit)="handleRenameCommit($event)"
          (renameCancel)="handleRenameCancel()"
          (rowContextMenu)="handleQueryRowContextMenu($event)"
        />
      </div>
    }
  </section>
</app-workspace-sidebar-panel-shell>

<tx-context-menu
  [open]="filterMenuOpen()"
  [position]="filterMenuPosition()"
  [items]="filterMenuItems()"
  (itemSelect)="handleFilterMenuSelect($event)"
  (closed)="handleFilterMenuClosed()"
/>

<tx-context-menu
  [open]="sortMenuOpen()"
  [position]="sortMenuPosition()"
  [items]="sortMenuItems()"
  (itemSelect)="handleSortMenuSelect($event)"
  (closed)="handleSortMenuClosed()"
/>

<tx-context-menu
  [open]="contextMenuOpen()"
  [position]="contextMenuPosition()"
  [items]="contextMenuItems()"
  (itemSelect)="handleContextMenuSelect($event)"
  (closed)="handleContextMenuClosed()"
/>

<tx-confirm-dialog
  [open]="deleteOpen()"
  title="Delete item"
  [message]="deleteMessage()"
  confirmLabel="Delete"
  variant="danger"
  (confirmed)="handleDeleteConfirmed()"
  (closed)="handleDeleteClosed()"
/>

<app-database-schema-picker-dialog
  [state]="schemaPickerState()"
  (applied)="handleSchemaPickerApplied($event)"
  (closed)="handleSchemaPickerClosed()"
/>
