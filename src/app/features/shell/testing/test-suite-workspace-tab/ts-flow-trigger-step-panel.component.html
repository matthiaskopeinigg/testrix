<div class="request-panel ts-flow-step-panel">
  <p class="ts-flow-step-panel__hint">
    Run another flow, or every flow under a folder (nested folders included), when this step
    executes. Nested runs inherit this flow’s variables and captures.
  </p>
  <tx-form-field label="Target type" controlId="ts-trg-type">
    <tx-dropdown
      controlId="ts-trg-type"
      [options]="targetTypeOptions"
      [ngModel]="targetType()"
      (ngModelChange)="patch({ targetType: $event, targetId: '' })"
    />
  </tx-form-field>
  <tx-form-field label="Target" controlId="ts-trg-id">
    <tx-tree-select
      id="ts-trg-id"
      [nodes]="targetTree()"
      [selectMode]="selectMode()"
      [showAncestorPath]="true"
      placeholder="Select target…"
      searchPlaceholder="Search flows and folders…"
      emptyLabel="No matching items"
      ariaLabel="Trigger target"
      [ngModel]="targetId()"
      (ngModelChange)="patch({ targetId: $event ?? '' })"
    />
  </tx-form-field>
  <tx-toggle
    controlId="ts-trg-reuse-e2e"
    label="Reuse E2E browser session"
    hint="Keep the same browser window, cookies, and login for later steps in this flow"
    [ngModel]="reuseE2eSession()"
    (ngModelChange)="patch({ reuseE2eSession: $event })"
  />
</div>
