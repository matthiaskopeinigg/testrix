<section class="ts-flow-settings" aria-label="Flow settings">
  <header class="ts-flow-settings__hero">
    <h2 class="ts-flow-settings__title">Settings</h2>
    <p class="ts-flow-settings__subtitle">
      Tags, critical gating, E2E window, and dataset rows.
    </p>
  </header>

  <tx-form-field label="Tags" controlId="ts-flow-settings-tags-field">
    <tx-tags-input
      class="ts-flow-settings__tags"
      controlId="ts-flow-settings-tags"
      placeholder="Tags…"
      [compact]="true"
      [maxTags]="5"
      [ngModel]="flow().tags"
      (ngModelChange)="tagsChange.emit($event)"
    />
  </tx-form-field>

  <tx-form-field label="Options" controlId="ts-flow-settings-options">
    <div class="ts-flow-settings__toggles" role="group" aria-label="Flow toggles">
      <tx-toggle
        class="ts-flow-settings__toggle"
        label="Critical"
        hint="Mark flow as critical"
        [ngModel]="flow().isCritical === true"
        (ngModelChange)="criticalChange.emit($event)"
      />

      @if (hasE2eSteps()) {
        <tx-toggle
          class="ts-flow-settings__toggle ts-flow-settings__toggle--e2e"
          label="Show E2E"
          hint="When off, the browser stays hidden (no taskbar window) while the flow runs"
          [ngModel]="e2eShowWindow()"
          (ngModelChange)="e2eShowWindowChange.emit($event)"
        />
        <tx-toggle
          class="ts-flow-settings__toggle ts-flow-settings__toggle--e2e"
          label="Keep E2E"
          hint="Leave the browser open after a successful run. Failed steps always close it."
          [ngModel]="e2eKeepWindowOpen()"
          (ngModelChange)="e2eKeepWindowOpenChange.emit($event)"
        />
      }
    </div>
  </tx-form-field>

  <tx-form-field label="Dataset" controlId="ts-flow-dataset">
    <tx-toggle
      label="Enable dataset"
      hint="Re-run this flow once per row. Column names become placeholders. Keep passwords in the vault, not this table."
      [ngModel]="datasetEnabled()"
      (ngModelChange)="handleDatasetEnabled($event)"
    />
    <tx-button variant="secondary" (pressed)="handleImportDataset()">Import CSV or JSON</tx-button>
    @if (datasetGridRows().length > 0) {
      <tx-data-grid
        [columns]="datasetColumns()"
        [rows]="datasetGridRows()"
        emptyLabel="No dataset rows"
      />
    }
  </tx-form-field>
</section>
